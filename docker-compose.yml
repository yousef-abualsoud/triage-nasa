services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8765:8765"
    environment:
      - NANOGPT_API_KEY=${NANOGPT_API_KEY:-}
      - NANOGPT_BASE_URL=${NANOGPT_BASE_URL:-https://api.nano-gpt.com/api/v1}
      - JEV_MODEL=${JEV_MODEL:-typesafe/jev-1.14}
      - JEV_CONCURRENCY=${JEV_CONCURRENCY:-12}
      - TIER2_MODEL=${TIER2_MODEL:-deepseek/deepseek-v4.1-flash-1017:thinking}
      - TIER2_MAX_TOKENS=${TIER2_MAX_TOKENS:-8000}
      - TIER2_TIMEOUT_S=${TIER2_TIMEOUT_S:-180}
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT:-}
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY:-}
      - AZURE_OPENAI_API_VERSION=${AZURE_OPENAI_API_VERSION:-2024-10-21}
      - AZURE_OPENAI_DEPLOYMENT=${AZURE_OPENAI_DEPLOYMENT:-gpt-4o}
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "8080:80"
    # The SPA is built inside the image; nginx serves it on 8080. The browser
    # connects to ws://host:8765 directly for the control loop.
    depends_on:
      - backend
    restart: unless-stopped
