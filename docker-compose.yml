services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8765:8765"
    environment:
      - NANOGPT_API_KEY=${NANOGPT_API_KEY:-}
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT:-}
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY:-}
      - AZURE_OPENAI_DEPLOYMENT=${AZURE_OPENAI_DEPLOYMENT:-gpt-4o}
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      # Serve the built SPA; nginx default.conf proxies nothing — the
      # browser connects to ws://host:8765 directly for the control loop.
      - ./src/frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend
    restart: unless-stopped